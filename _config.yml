# Настройки GitHub Pages (Jekyll). На обычном хостинге этот файл ни на что не влияет.
# PHP на Pages не работает, поэтому настоящую админку и сборщик не публикуем:
# там они были бы просто исходниками для скачивания. Для показа есть admin-demo/.
exclude:
  - admin/
  - includes/
  - scripts/
  - data/backups/
